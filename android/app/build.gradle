plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rightpad.capture'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rightpad.capture'
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
